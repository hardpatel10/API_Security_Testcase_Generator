openapi: 3.0.3
info:
  title: Library API (sample)
  version: 1.0.0
servers:
  - url: https://library.example.com/api
paths:
  /books:
    get:
      tags: [Books]
      summary: List books
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK }
    post:
      tags: [Books]
      summary: Create a book
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Book"
      responses:
        "201": { description: Created }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "429": { description: Too many requests }
  /books/{bookId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Books]
      summary: Get a book
      security:
        - bearerAuth: []
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }
    delete:
      tags: [Books]
      summary: Delete a book
      responses:
        "204": { description: Deleted }
  /members/login:
    post:
      tags: [Members]
      summary: Member login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string, example: "hunter2hunter2" }
      responses:
        "200": { description: OK }
  /members/{memberId}/avatar:
    post:
      tags: [Members]
      summary: Upload member avatar
      security:
        - apiKeyQuery: []
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: OK }
  /internal/debug/config:
    get:
      tags: [Internal]
      summary: Debug configuration
      responses:
        "200": { description: OK }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKeyQuery: { type: apiKey, in: query, name: api_key }
  schemas:
    Book:
      type: object
      properties:
        title: { type: string }
        author: { type: string }
        price: { type: number }
        isAdmin: { type: boolean }
        publisher:
          type: object
          properties:
            name: { type: string }
            webhookUrl: { type: string }
